name: Monev Attendance Runner

on:
  schedule:
    # Jadwal sore hari kerja Senin-Jumat (UTC):
    # 09:52 UTC = 16:52 WIB
    - cron: '52 9 * * 1-5'
    # 10:07, 10:22, 10:37, 10:52, 11:07, 11:22, 11:37, 11:52 UTC = 17:07 s/d 18:52 WIB
    - cron: '7,22,37,52 10-11 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pilih mode eksekusi'
        required: true
        default: 'run'
        type: choice
        options:
          - run
          - check
          - submit
          - preview
      dry_run:
        description: 'Simulasi (DRY RUN) tanpa submit ke Monev'
        required: false
        default: false
        type: boolean

concurrency:
  group: monev-bot
  cancel-in-progress: false

jobs:
  run-attendance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx python-dotenv tzdata groq cryptography

      - name: Run Monev Bot
        env:
          MONEV_EMAIL: ${{ secrets.MONEV_EMAIL }}
          MONEV_PASSWORD: ${{ secrets.MONEV_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TEMPLATES_JSON: ${{ secrets.TEMPLATES_JSON }}
          WARN_AFTER: ${{ vars.WARN_AFTER || '17:15' }}
          SUBMIT_AFTER: ${{ vars.SUBMIT_AFTER || '17:45' }}
          OFF_DAYS: ${{ vars.OFF_DAYS || 'Saturday,Sunday' }}
          AUTO_SUBMIT: ${{ vars.AUTO_SUBMIT || 'true' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
        run: |
          MODE_ARG="${{ github.event.inputs.mode || 'run' }}"
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ] || [ "${{ vars.DRY_RUN }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          python runner.py --mode "$MODE_ARG" $DRY_FLAG

      - name: Commit & Push state.json if modified
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain state.json)" ]; then
            git add state.json
            git commit -m "chore(state): update state.json [skip ci]"
            git pull --rebase origin main || git pull --rebase
            git push origin HEAD || true
          fi

      - name: Keepalive schedule (prevent auto-disable after 45 days)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LAST_COMMIT_TS=$(git log -1 --format=%ct)
          NOW_TS=$(date +%s)
          DIFF_DAYS=$(( (NOW_TS - LAST_COMMIT_TS) / 86400 ))
          if [ "$DIFF_DAYS" -ge 45 ]; then
            git commit --allow-empty -m "chore: keepalive cron schedule [skip ci]"
            git push origin HEAD || true
          fi
